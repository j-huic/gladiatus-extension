<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gladiatus Helper (Unofficial)</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Gladiatus Helper</h1>
        <div id="context-label" class="context-label">Unofficial</div>
      </div>
      <button id="scan-button" type="button">Scan auction</button>
    </header>

    <nav id="app-nav" class="app-nav" aria-label="Popup sections">
      <button type="button" data-shell-page="home">Home</button>
      <button id="workspace-nav" type="button" data-shell-page="workspace">Current page</button>
      <button type="button" data-shell-page="settings">Settings</button>
    </nav>

    <p id="status" role="status" aria-live="polite">Loading settings…</p>

    <nav id="page-tabs" class="page-tabs"></nav>
    <section id="summary" hidden></section>
    <nav id="tabs" class="tabs" hidden></nav>
    <section id="controls" class="controls" hidden></section>
    <main id="results" class="results"></main>

    <aside id="diagnostics" class="diagnostics" hidden>
      <details>
        <summary>Diagnostics</summary>
        <p>Debug logs stay in this browser until you clear or export them.</p>
        <div id="dev-log" class="dev-log">
          <button id="dev-log-download" type="button">Export debug log</button>
          <button id="dev-log-clear" type="button">Clear debug log</button>
        </div>
      </details>
    </aside>

    <script src="../shared/helper-security.js"></script>
    <script src="../shared/helper-settings.js"></script>
    <script src="../shared/logging/log-core.js"></script>
    <script src="../shared/logging/log-buffer.js"></script>
    <script src="../shared/logging/log-drain.js"></script>
    <script src="../shared/logging/log-setup.js"></script>
    <script src="../features/smelting/smelting-material-data.js"></script>
    <script src="../features/smelting/smelting-tooltip-model.js"></script>
    <script src="../features/auction/auction-schema.js"></script>
    <script src="../shared/score-model.js"></script>
    <script src="../features/auction/auction-model.js"></script>
    <script src="../shared/tooltip-parser.js"></script>
    <script src="../features/auction/auction-core.js"></script>
    <script src="../features/arena/arena-core.js"></script>
    <script src="../features/arena/arena-sim.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
